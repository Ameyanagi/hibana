name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Match tag, versions, compiler, and changelog
        run: |
          set -euo pipefail
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)"
          recipe_version="$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' conda.recipe/recipe.yaml)"
          [[ "$workspace_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$recipe_version" == "$workspace_version" ]]
          [[ "$GITHUB_REF" == "refs/tags/v${workspace_version}" ]]
          [[ "$(git cat-file -t "$GITHUB_REF")" == "tag" ]]
          [[ "$(git rev-parse "${GITHUB_REF}^{commit}")" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          [[ "$(sed -n 's/^mojo = "\([^"]*\)"$/\1/p' pixi.toml)" == "==1.0.0" ]]
          exact_pins="$(grep -Ec '^    - mojo-compiler ==1\.0\.0$' conda.recipe/recipe.yaml)"
          compiler_dependencies="$(grep -Ec '^[[:space:]]*- mojo-compiler([[:space:]]|$)' conda.recipe/recipe.yaml)"
          [[ "$exact_pins" -eq 3 && "$compiler_dependencies" -eq 3 ]]
          grep -Fq "## [${workspace_version}] - " CHANGELOG.md

  check:
    name: Check ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Check source and installed package
        run: |
          set -euo pipefail
          pixi run --locked check
          pixi run --locked package
          bash scripts/check-package-metadata.sh

  publish:
    name: Publish source release
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build source archive
        run: >-
          git archive --format=tar.gz
          --prefix="hibana-${GITHUB_REF_NAME}/"
          --output="hibana-${GITHUB_REF_NAME}.tar.gz"
          "${GITHUB_SHA}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "hibana-${GITHUB_REF_NAME}.tar.gz"
          --verify-tag --generate-notes
          --title "Hibana ${GITHUB_REF_NAME}"
