name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify locked workspace
        run: pixi run --locked check

  package:
    name: Package Linux x86-64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify package version
        run: |
          set -euo pipefail
          pixi_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)
          recipe_version=$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' conda.recipe/recipe.yaml)
          if [[ -z "$pixi_version" || -z "$recipe_version" || "$pixi_version" != "$recipe_version" ]]; then
            echo "pixi.toml version '$pixi_version' does not match recipe version '$recipe_version'" >&2
            exit 1
          fi
          exact_pins=$(grep -Ec '^    - mojo-compiler ==1\.0\.0$' conda.recipe/recipe.yaml)
          compiler_dependencies=$(grep -Ec '^[[:space:]]*- mojo-compiler([[:space:]]|$)' conda.recipe/recipe.yaml)
          [[ "$exact_pins" -eq 3 && "$compiler_dependencies" -eq 3 ]]
      - name: Build package
        run: pixi run --locked package
      - name: Verify emitted package metadata
        run: bash scripts/check-package-metadata.sh
